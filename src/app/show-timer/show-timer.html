<div class="flex min-h-screen items-center justify-center bg-gray-100 p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-lg">
    <h2 class="mb-6 text-3xl font-bold text-gray-800">Timer</h2>
    <p class="mb-8 font-mono text-6xl font-semibold text-gray-900">
      {{ minute().toString().padStart(2, '0') }} : {{ second().toString().padStart(2, '0') }}
    </p>

    <div class="flex justify-center gap-2">
      <button class="rounded-lg bg-green-500 text-black px-2 py-2" (click)="start()">Start</button>
      <button class="rounded-lg bg-amber-300 text-black px-2 py-2" (click)="stop()">Stop</button>
      <button class="rounded-lg bg-red-500 text-black px-2 py-2" (click)="reset()">Reset</button>
    </div>
  </div>
</div>
